# Production on one server: Caddy (HTTPS) -> app -> Postgres, plus a backup loop.
# Run from this folder:  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sampcup
      POSTGRES_USER: sampcup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sampcup -d sampcup"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://sampcup:${POSTGRES_PASSWORD}@db:5432/sampcup
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-sampcup.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    # A compressed dump every 6 hours; dumps in /backups older than 14 days are removed.
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h db -U sampcup sampcup | gzip > /backups/sampcup-$$(date +%Y%m%d-%H%M).sql.gz
          find /backups -name 'sampcup-*.sql.gz' -mtime +14 -delete
          sleep 21600
        done

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
