[project]
name = "sampcup-api"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
omit = ["app/__init__.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
