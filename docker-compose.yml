# Local development only. Ports are bound to this machine, not the network.
services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory"]
    ports:
      - "127.0.0.1:8001:8000"

  api:
    build:
      context: ./backend
    # DynamoDB Local takes a moment to listen: retry creating the table until it answers.
    command: >-
      sh -c "until python -m app.cli create-table; do sleep 2; done &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      APP_ENV: development
      TABLE_NAME: sampcup-local
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/srv/api/app
    depends_on:
      - dynamodb

  web:
    build:
      context: ./frontend
      target: dev
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api
